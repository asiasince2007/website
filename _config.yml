# GitHub Pages baut diesen Branch mit Jekyll (kein .nojekyll vorhanden).
# Diese Liste hält Planungs-, Quell- und Tooling-Dateien aus dem deployten
# Site-Output heraus. Lokale Gedächtnis-/Archivdateien sind zusätzlich
# in .gitignore ausgeschlossen und gehören nicht in die Git-Versionierung.
# Hinweis: robots.txt-Disallow allein verhindert weder Zugriff noch Indexierung.
exclude:
  - docs
  - design
  - 90_Archiv
  - 00_Gedaechtnis
  - scripts
  - node_modules
  - gitapply.txt
  - package.json
  - package-lock.json
  - README.md
  - CLAUDE.md
  - tests
  - playwright.config.js
  - .claude
  - .github
