<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Zwischenseite fuer die Routenplanung.
         Zweck: Der Klick auf „Route planen" fuehrt sonst direkt zu Google und
         hinterlaesst auf unserer Seite keine Spur. Ueber diese Zwischenstation
         wird daraus eine gewoehnliche Seitenanfrage, die die serverseitige
         Statistik zaehlen kann, ohne Skript, ohne Cookie, ohne Zugriff auf das
         Endgeraet der Besucher. Deshalb bleibt sie einwilligungsfrei.
         Die Weiterleitung laeuft ueber <meta http-equiv="refresh">, damit sie
         auch ohne JavaScript funktioniert. Die aufrufenden Links tragen
         target="_blank"; ein Zurueck-Knopf laeuft daher nicht in eine Schleife. -->
    <meta http-equiv="refresh" content="0; url=https://www.google.com/maps/dir/?api=1&amp;destination=Asia+Markt+Thien+Phu%2C+Hauptstra%C3%9Fe+74%2C+40764+Langenfeld">

    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'none'; connect-src 'self'; form-action 'none'; upgrade-insecure-requests">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">

    <title>Route wird geöffnet | Asia Markt Thien Phu</title>
    <meta name="theme-color" content="#FFFBF5">
    <link rel="icon" href="/favicon.ico" sizes="48x48">

    <style>
        :root {
            --creme: #FFFBF5;
            --tinte: #241C16;
            --grau: #5A4E43;
            --rot: #B4342E;
            --rot-dunkel: #8E2320;
            --linie: rgba(120, 70, 70, .24);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: var(--creme);
            color: var(--grau);
            font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
            font-size: 17px;
            line-height: 1.65;
            text-align: center;
        }
        main { max-width: 34rem; }
        .rubrik {
            margin: 0 0 10px;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--rot);
        }
        h1 {
            margin: 0 0 14px;
            font-size: 28px;
            line-height: 1.25;
            font-weight: 700;
            color: var(--tinte);
            text-wrap: balance;
        }
        p { margin: 0 0 16px; }
        .knopf {
            display: inline-block;
            margin-top: 6px;
            padding: 13px 26px;
            border-radius: 999px;
            background: var(--rot);
            color: #fff;
            font-weight: 700;
            text-decoration: none;
        }
        .knopf:hover, .knopf:focus-visible { background: var(--rot-dunkel); }
        a:focus-visible {
            outline: 2px solid var(--rot-dunkel);
            outline-offset: 3px;
        }
        .klein { margin-top: 26px; font-size: 15px; }
        .klein a { color: var(--grau); }
    </style>
</head>
<body>

<main>
    <p class="rubrik">Asia Markt Thien Phu</p>
    <h1>Route wird geöffnet …</h1>
    <p>Sie werden zu Google Maps weitergeleitet, damit die Navigation zur Hauptstraße 74 in Langenfeld startet.</p>
    <p>
        <a class="knopf" href="https://www.google.com/maps/dir/?api=1&amp;destination=Asia+Markt+Thien+Phu%2C+Hauptstra%C3%9Fe+74%2C+40764+Langenfeld" rel="noopener">Route jetzt öffnen</a>
    </p>
    <p class="klein"><a href="/">Zurück zur Startseite</a> &nbsp;·&nbsp; <a href="tel:+4921731065590">02173 1065590 anrufen</a></p>
</main>

</body>
</html>
