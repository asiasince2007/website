<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@600;700&family=Nunito:wght@500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #FDFBF7;
    display: flex; align-items: center;
    font-family: 'Nunito', sans-serif;
    position: relative; overflow: hidden;
  }
  .shape1 { position: absolute; width: 420px; height: 420px; border-radius: 38% 62% 55% 45% / 55% 48% 52% 45%; background: #F4EFE6; top: -120px; right: -80px; }
  .shape2 { position: absolute; width: 340px; height: 340px; border-radius: 50%; background: rgba(91,138,104,0.15); bottom: -140px; right: 180px; }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 14px; background: #2D4A36; }
  .inner { display: flex; align-items: center; gap: 64px; padding: 0 90px; position: relative; }
  .logo { width: 260px; height: 260px; border-radius: 50%; box-shadow: 0 12px 40px rgba(45,74,54,0.18); }
  h1 { font-family: 'Lora', serif; font-size: 64px; font-weight: 700; color: #2D4A36; line-height: 1.15; margin-bottom: 18px; }
  .sub { font-size: 30px; color: #5B8A68; font-weight: 600; margin-bottom: 26px; }
  .badge { display: inline-block; background: #2D4A36; color: #FDFBF7; font-size: 24px; font-weight: 600; padding: 10px 28px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="shape1"></div>
  <div class="shape2"></div>
  <div class="bar"></div>
  <div class="inner">
    <img class="logo" src="../assets/images/thien_phu_logo.webp" alt="">
    <div>
      <h1>Asia Markt<br>Thien Phu</h1>
      <div class="sub">Asiatische Lebensmittel in Langenfeld</div>
      <div class="badge">Ihr Asia Markt seit 2007</div>
    </div>
  </div>
</body>
</html>
